name: Win11 Bore RDP Long

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Write-Host "=== 1. Enabling RDP ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $svc = Get-Service TermService
          Write-Host "TermService Status: $($svc.Status)"
          if ($svc.Status -ne "Running") {
              Start-Service TermService
              Start-Sleep -Seconds 2
              Write-Host "TermService started"
          }
          Write-Host "RDP Enabled"

      - name: Create RDP User
        run: |
          Write-Host "=== 2. Creating User ==="
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
              Write-Host "User RDP already exists → password updated"
          } else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
              Write-Host "User RDP created"
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          Get-LocalUser -Name "RDP" | Format-Table Name, Enabled
          Write-Host "User setup done"

      - name: Download & Start Bore Tunnel
        shell: powershell
        run: |
          Write-Host "=== 3. Downloading Bore ==="
          
          $boreDir = "C:\bore"
          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null
          
          $zipPath = "$boreDir\bore.zip"
          $boreExe = "$boreDir\bore.exe"
          
          Write-Host "Downloading bore v0.6.0..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile $zipPath -UseBasicParsing
          
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force
          
          if (-not (Test-Path $boreExe)) {
              Write-Host "ERROR: bore.exe not found after extract!"
              Get-ChildItem $boreDir -Recurse | Format-Table
              exit 1
          }
          
          Write-Host "bore.exe ready: $boreExe"
          & $boreExe --version
          
          Write-Host ""
          Write-Host "=== 4. Starting Bore Tunnel ==="
          
          $logOut = "$boreDir\bore_out.log"
          $logErr = "$boreDir\bore_err.log"
          
          if (Test-Path $logOut) { Remove-Item $logOut -Force }
          if (Test-Path $logErr) { Remove-Item $logErr -Force }
          
          # Bore'u arka planda başlat
          $process = Start-Process -FilePath $boreExe `
              -ArgumentList "local","3389","--to","bore.pub" `
              -WorkingDirectory $boreDir `
              -RedirectStandardOutput $logOut `
              -RedirectStandardError $logErr `
              -NoNewWindow `
              -PassThru
          
          Write-Host "Bore process started. PID: $($process.Id)"
          Write-Host "Waiting for public address (max 30 seconds)..."
          
          $publicAddress = $null
          $success = $false
          
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1
              
              $outContent = ""
              $errContent = ""
              
              if (Test-Path $logOut) { $outContent = Get-Content $logOut -Raw -ErrorAction SilentlyContinue }
              if (Test-Path $logErr) { $errContent = Get-Content $logErr -Raw -ErrorAction SilentlyContinue }
              
              $combined = "$outContent`n$errContent"
              
              # Adres yakalama
              if ($combined -match "bore\.pub:(\d+)") {
                  $publicAddress = "bore.pub:$($Matches[1])"
                  $success = $true
                  Write-Host "FOUND → $publicAddress"
                  break
              }
              
              if ($combined -match "listening at\s+([^\s]+)") {
                  $publicAddress = $Matches[1]
                  $success = $true
                  Write-Host "FOUND → $publicAddress"
                  break
              }
              
              # Process öldü mü?
              if ($process.HasExited) {
                  Write-Host "ERROR: Bore process exited early! ExitCode: $($process.ExitCode)"
                  break
              }
              
              Write-Host "Waiting... ($i/30)"
          }
          
          Write-Host ""
          Write-Host "========== BORE STDOUT =========="
          if (Test-Path $logOut) { Get-Content $logOut } else { Write-Host "(empty)" }
          Write-Host "========== BORE STDERR =========="
          if (Test-Path $logErr) { Get-Content $logErr } else { Write-Host "(empty)" }
          Write-Host "================================="
          Write-Host ""
          
          if ($success -and $publicAddress) {
              Write-Host "==============================================="
              Write-Host "RDP CONNECTION INFO (via bore)"
              Write-Host "==============================================="
              Write-Host "Address (Computer): $publicAddress"
              Write-Host "Username:           RDP"
              Write-Host "Password:           TechZoner@001"
              Write-Host "==============================================="
              Write-Host ""
              Write-Host "Tunnel appears to be UP (PID: $($process.Id))"
          } else {
              Write-Host "==============================================="
              Write-Host "FAILED - Could not get public address"
              Write-Host "==============================================="
              Write-Host "Process still running: $(-not $process.HasExited)"
              if ($process.HasExited) {
                  Write-Host "Exit code: $($process.ExitCode)"
              }
          }

      - name: Keep Alive + Monitor
        run: |
          Write-Host "=== 5. Keep Alive + Tunnel Monitor ==="
          Write-Host "Will run until job timeout (~6 hours)"
          Write-Host ""
          
          $counter = 0
          while ($true) {
              $counter++
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              
              $boreProcs = Get-Process -Name "bore" -ErrorAction SilentlyContinue
              
              if ($boreProcs) {
                  Write-Host "[$time] Tunnel ACTIVE | bore processes: $($boreProcs.Count) | cycle: $counter"
              } else {
                  Write-Host "[$time] WARNING: bore process NOT FOUND - tunnel may be dead | cycle: $counter"
              }
              
              # Her 5 dakikada bir logun sonunu da bas
              if ($counter % 5 -eq 0) {
                  $logOut = "C:\bore\bore_out.log"
                  $logErr = "C:\bore\bore_err.log"
                  Write-Host "--- Last log lines ---"
                  if (Test-Path $logOut) { Get-Content $logOut -Tail 5 }
                  if (Test-Path $logErr) { Get-Content $logErr -Tail 5 }
                  Write-Host "----------------------"
              }
              
              Start-Sleep -Seconds 60
          }
