name: win 11 frp rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download frp Client
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          New-Item -ItemType Directory -Path $frpDir -Force | Out-Null
          $zipPath = "$frpDir\frp.zip"
          
          Write-Host "Downloading frp..."
          Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v0.64.0/frp_0.64.0_windows_amd64.zip" -OutFile $zipPath -UseBasicParsing
          
          Expand-Archive -Path $zipPath -DestinationPath $frpDir -Force
          $frpcPath = Get-ChildItem -Path $frpDir -Recurse -Filter "frpc.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "frpc.exe found at: $frpcPath"
          
          # frpc yolunu bir sonraki adım için kaydet
          $frpcPath | Out-File -FilePath "$frpDir\frpc_path.txt" -Encoding utf8

      - name: Start frp Tunnel
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          $frpcPath = Get-Content "$frpDir\frpc_path.txt" -Raw
          $frpcPath = $frpcPath.Trim()
          
          # frpc yapılandırma dosyası (TOML)
          $configContent = @"
          serverAddr = "frp3.chuantou.org"
          serverPort = 7000
          auth.token = "www.chuantou.org"
          
          [[proxies]]
          name = "github-rdp"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 3389
          remotePort = 50000
          "@
          
          $configPath = "$frpDir\frpc.toml"
          $configContent | Out-File -FilePath $configPath -Encoding utf8
          
          Write-Host "Starting frpc tunnel..."
          Start-Process -FilePath $frpcPath -ArgumentList "-c", $configPath -WindowStyle Hidden
          
          Start-Sleep -Seconds 10
          
          Write-Host "`n==============================================="
          Write-Host "🚀 RDP CONNECTION INFO (via frp)"
          Write-Host "Address (Computer): frp3.chuantou.org:50000"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "===============================================`n"
          Write-Host "Note: If port 50000 is busy, change 'remotePort' in the config above to another number (e.g., 50001) and rerun."

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via frp..."
              Start-Sleep -Seconds 300
          }
