name: win 11 serveo rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350 # 6 saate kadar açık kalır

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Start Serveo TCP Tunnel
        shell: powershell
        run: |
          $logFile = "C:\serveo_out.log"
          if (Test-Path $logFile) { Remove-Item $logFile -Force }
          
          Write-Host "Starting Serveo TCP tunnel for RDP (port 3389)..."
          # Serveo'ya TCP tüneli için bağlan. Çıktıyı log dosyasına yaz.
          # Windows'ta 'ssh' komutu varsayılan olarak gelir.
          $proc = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net" -NoNewWindow -RedirectStandardOutput $logFile -RedirectStandardError "C:\serveo_err.log" -PassThru
          
          Start-Sleep -Seconds 15
          
          Write-Host "`n--- Serveo Output ---"
          if (Test-Path $logFile) { Get-Content $logFile -Tail 30 }
          if (Test-Path "C:\serveo_err.log") { Get-Content "C:\serveo_err.log" -Tail 30 }
          
          # Loglardan public adresi çek (Serveo genelde "Forwarding TCP connect to localhost:3389" ve bir adres basar)
          $publicAddress = $null
          if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw
              # Serveo çıktısında genellikle "serveo.net:PORT" şeklinde bir adres olur
              if ($content -match "serveo\.net:(\d+)") {
                  $publicAddress = "serveo.net:$($Matches[1])"
              }
          }
          
          if ($publicAddress) {
              Write-Host "`n==============================================="
              Write-Host "🚀 RDP CONNECTION INFO (via Serveo)"
              Write-Host "Address (Computer): $publicAddress"
              Write-Host "Username: RDP"
              Write-Host "Password: TechZoner@001"
              Write-Host "===============================================`n"
          } else {
              Write-Warning "Could not parse Serveo address. Check the logs above. The SSH process might still be connecting."
              Write-Host "If you see 'Warning: Permanently added...' that is normal."
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via Serveo..."
              Start-Sleep -Seconds 300
          }
