name: win 11 proxvn rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP on Port 3389
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download ProxVN Tunnel
        shell: powershell
        run: |
          $dir = "C:\proxvn"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $exe = "$dir\proxvn.exe"
          # GitHub releases'den Windows binary'sini çek (Projede genelde doğrudan link olur, yoksa build edilir ama hazır binary olduğunu varsayıyoruz)
          # Eğer bu link çalışmazsa, repo releases sayfasından doğrudan link alınabilir.
          Invoke-WebRequest -Uri "https://github.com/hoangtuvungcao/proxvn_tunnel_full/releases/latest/download/proxvn-windows-amd64.exe" -OutFile $exe -UseBasicParsing
          Write-Host "ProxVN downloaded to $exe"

      - name: Start ProxVN Tunnel for RDP
        shell: powershell
        run: |
          $dir = "C:\proxvn"
          $exe = "$dir\proxvn.exe"
          
          Write-Host "Starting ProxVN tunnel for RDP (port 3389)..."
          # --proto tcp 3389 çalıştırıp çıktıyı log dosyasına alıyoruz
          Start-Process -FilePath $exe -ArgumentList "--proto tcp 3389" -WorkingDirectory $dir -NoNewWindow -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
          
          Start-Sleep -Seconds 15
          
          Write-Host "`n--- ProxVN Output ---"
          if (Test-Path "$dir\out.log") { Get-Content "$dir\out.log" }
          if (Test-Path "$dir\err.log") { Get-Content "$dir\err.log" }
          Write-Host "--------------------`n"
          
          Write-Host "==============================================="
          Write-Host "🚀 RDP CONNECTION INFO"
          Write-Host "Address (Computer): Check the 'Public Address' line above (e.g., 103.77.246.196:12345)"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "==============================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via ProxVN..."
              Start-Sleep -Seconds 300
          }
