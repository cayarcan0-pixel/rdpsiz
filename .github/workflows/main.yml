name: win 11 playit rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download and Start playit.gg Agent
        shell: powershell
        run: |
          $playitDir = "C:\playit"
          New-Item -ItemType Directory -Path $playitDir -Force | Out-Null
          $playitExe = "$playitDir\playit.exe"
          
          Write-Host "Downloading playit.gg agent..."
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile $playitExe -UseBasicParsing
          
          Write-Host "Starting playit agent..."
          Start-Process -FilePath $playitExe -WorkingDirectory $playitDir -WindowStyle Hidden
          
          Start-Sleep -Seconds 10
          
          Write-Host "`n==============================================="
          Write-Host "PLAYIT.GG CLAIM INSTRUCTIONS"
          Write-Host "1. Look for a claim URL in the log below (or check the playit.exe console window)."
          Write-Host "2. Open that URL, log in / sign up, and claim this agent."
          Write-Host "3. In the playit dashboard, create a TCP tunnel for port 3389."
          Write-Host "4. Copy the public IP:PORT (e.g., 1.tcp.eu.playit.gg:12345) and use it in RDP."
          Write-Host "===============================================`n"
          
          # Ajanın loglarını görünür kılmak için birkaç saniye bekle ve dosyaları kontrol et
          Start-Sleep -Seconds 5
          $logFiles = Get-ChildItem -Path $playitDir -Filter "*.log" -ErrorAction SilentlyContinue
          if ($logFiles) {
              foreach ($log in $logFiles) {
                  Write-Host "--- $($log.Name) ---"
                  Get-Content $log.FullName -Tail 50
              }
          } else {
              Write-Host "No log file yet. The claim URL should appear in the playit.exe console window."
              Write-Host "If you cannot see it, the agent may need to be run interactively once."
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via playit.gg..."
              Start-Sleep -Seconds 300
          }
