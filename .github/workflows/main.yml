name: Win11 Serveo RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP Enabled"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          Write-Host "User RDP created / updated"

      - name: Start Serveo Tunnel
        shell: powershell
        run: |
          Write-Host "Starting Serveo tunnel..."
          
          # Serveo tunnel'ı arka planda başlat
          $process = Start-Process -FilePath "ssh" -ArgumentList @(
              "-o", "StrictHostKeyChecking=no",
              "-o", "ServerAliveInterval=30",
              "-o", "ServerAliveCountMax=3",
              "-R", "0:localhost:3389",
              "serveo.net"
          ) -NoNewWindow -PassThru -RedirectStandardOutput "serveo_out.log" -RedirectStandardError "serveo_err.log"
          
          # Adresin çıkmasını bekle
          Start-Sleep -Seconds 8
          
          $publicAddress = $null
          $maxTries = 15
          
          for ($i = 1; $i -le $maxTries; $i++) {
              if (Test-Path "serveo_out.log") {
                  $content = Get-Content "serveo_out.log" -Raw
                  
                  # Serveo'nun verdiği portu yakala
                  if ($content -match "serveo\.net:(\d+)") {
                      $publicAddress = "serveo.net:$($Matches[1])"
                      break
                  }
                  if ($content -match "Forwarding TCP connections from ([^\s]+)") {
                      $publicAddress = $Matches[1]
                      break
                  }
              }
              Start-Sleep -Seconds 2
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host "RDP CONNECTION INFO (via Serveo)"
          Write-Host "==============================================="
          
          if ($publicAddress) {
              Write-Host "Address (Computer): $publicAddress"
          } else {
              Write-Host "Address bulunamadı. Log'a bak:"
              if (Test-Path "serveo_out.log") { Get-Content "serveo_out.log" }
              if (Test-Path "serveo_err.log") { Get-Content "serveo_err.log" }
          }
          
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "==============================================="
          Write-Host ""

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active via Serveo..."
              Start-Sleep -Seconds 300
          }
