name: win 11 bore rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download bore
        shell: powershell
        run: |
          $boreDir = "C:\bore"
          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null
          $zipPath = "$boreDir\bore.zip"
          
          Write-Host "Downloading bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile $zipPath -UseBasicParsing
          
          Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force
          $boreExe = Get-ChildItem -Path $boreDir -Recurse -Filter "bore.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "bore.exe found at: $boreExe"
          
          $boreExe | Out-File -FilePath "$boreDir\bore_path.txt" -Encoding utf8

      - name: Start bore Tunnel
        shell: powershell
        run: |
          $boreDir = "C:\bore"
          $boreExe = (Get-Content "$boreDir\bore_path.txt" -Raw).Trim()
          $logFile = "$boreDir\bore_out.log"
          
          if (Test-Path $logFile) { Remove-Item $logFile -Force }
          
          Write-Host "Starting bore tunnel for RDP..."
          # bore çıktısını log dosyasına yönlendiriyoruz
          Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -WorkingDirectory $boreDir -NoNewWindow -RedirectStandardOutput $logFile -RedirectStandardError "$boreDir\bore_err.log"
          
          # Çıktının oturması için bekle
          Start-Sleep -Seconds 10
          
          $publicAddress = $null
          if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw
              # Çıktıda bore.pub:PORT formatını ara
              if ($content -match "bore\.pub:(\d+)") {
                  $publicAddress = "bore.pub:$($Matches[1])"
              }
          }
          
          if ($publicAddress) {
              Write-Host "`n==============================================="
              Write-Host "🚀 RDP CONNECTION INFO (via bore)"
              Write-Host "Address (Computer): $publicAddress"
              Write-Host "Username: RDP"
              Write-Host "Password: TechZoner@001"
              Write-Host "===============================================`n"
          } else {
              Write-Warning "Could not find bore.pub address in log. Check the log below:"
              if (Test-Path $logFile) { Get-Content $logFile -Tail 30 }
              if (Test-Path "$boreDir\bore_err.log") { Get-Content "$boreDir\bore_err.log" -Tail 30 }
              Write-Host "You may need to try again; bore.pub can be crowded sometimes."
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via bore..."
              Start-Sleep -Seconds 300
          }
