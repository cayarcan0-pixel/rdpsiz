name: win 11 unlimited frpee rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download frp Client
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          New-Item -ItemType Directory -Path $frpDir -Force | Out-Null
          $zipPath = "$frpDir\frp.zip"
          Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v0.64.0/frp_0.64.0_windows_amd64.zip" -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $frpDir -Force
          $frpcPath = Get-ChildItem -Path $frpDir -Recurse -Filter "frpc.exe" | Select-Object -First 1 -ExpandProperty FullName
          $frpcPath | Out-File -FilePath "$frpDir\frpc_path.txt" -Encoding utf8

      - name: Start Unlimited frpee Tunnel
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          $frpcPath = (Get-Content "$frpDir\frpc_path.txt" -Raw).Trim()
          
          # Rastgele bir uzak port seçiyoruz (10000 - 65000 arası)
          $remotePort = Get-Random -Minimum 10000 -Maximum 65000
          
          $configContent = @"
          serverAddr = "free.frpee.com"
          serverPort = 7000
          auth.method = "token"
          auth.token = "free.frpee.com"

          [[proxies]]
          name = "rdp-tunnel"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 3389
          remotePort = $remotePort
          "@
          
          $configPath = "$frpDir\frpc.toml"
          $configContent | Out-File -FilePath $configPath -Encoding utf8
          
          Write-Host "Starting frpc tunnel to frpee.com..."
          Start-Process -FilePath $frpcPath -ArgumentList "-c", $configPath -WindowStyle Hidden
          
          Start-Sleep -Seconds 10
          
          Write-Host "`n==============================================="
          Write-Host "🚀 SINIRSIZ RDP CONNECTION INFO (via frpee)"
          Write-Host "Address (Computer): free.frpee.com:$remotePort"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "===============================================`n"

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via frpee (No Time Limit)..."
              Start-Sleep -Seconds 300
          }
