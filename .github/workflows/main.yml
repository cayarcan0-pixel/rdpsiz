name: win 11 frp rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download frp Client
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          New-Item -ItemType Directory -Path $frpDir -Force | Out-Null
          $zipPath = "$frpDir\frp.zip"
          
          Write-Host "Downloading frp..."
          Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v0.64.0/frp_0.64.0_windows_amd64.zip" -OutFile $zipPath -UseBasicParsing
          
          Expand-Archive -Path $zipPath -DestinationPath $frpDir -Force
          $frpcPath = Get-ChildItem -Path $frpDir -Recurse -Filter "frpc.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "frpc.exe found at: $frpcPath"
          
          $frpcPath | Out-File -FilePath "$frpDir\frpc_path.txt" -Encoding utf8

      - name: Start frp Tunnel (Foreground with Logs)
        shell: powershell
        run: |
          $frpDir = "C:\frp"
          $frpcPath = (Get-Content "$frpDir\frpc_path.txt" -Raw).Trim()
          
          # remotePort'u 50001 olarak değiştirdik, çakışma olursa 50002, 50003 dene
          $configContent = @"
          serverAddr = "frp3.chuantou.org"
          serverPort = 7000
          auth.token = "www.chuantou.org"
          
          [[proxies]]
          name = "github-rdp"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 3389
          remotePort = 50001
          "@
          
          $configPath = "$frpDir\frpc.toml"
          $configContent | Out-File -FilePath $configPath -Encoding utf8
          
          Write-Host "Starting frpc tunnel in foreground to see logs..."
          Write-Host "Waiting 15 seconds for connection..."
          
          # Ön planda başlatıp çıktıyı yakalıyoruz
          $proc = Start-Process -FilePath $frpcPath -ArgumentList "-c", $configPath -NoNewWindow -PassThru -RedirectStandardOutput "$frpDir\frpc_out.log" -RedirectStandardError "$frpDir\frpc_err.log"
          
          Start-Sleep -Seconds 15
          
          Write-Host "--- frpc stdout ---"
          if (Test-Path "$frpDir\frpc_out.log") { Get-Content "$frpDir\frpc_out.log" -Tail 30 }
          Write-Host "--- frpc stderr ---"
          if (Test-Path "$frpDir\frpc_err.log") { Get-Content "$frpDir\frpc_err.log" -Tail 30 }
          
          Write-Host "`n==============================================="
          Write-Host "🚀 RDP CONNECTION INFO (via frp)"
          Write-Host "Address (Computer): frp3.chuantou.org:50001"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "===============================================`n"
          Write-Host "If connection fails, check frpc logs above. The port 50001 might be busy too. Try 50002, 50003."

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via frp..."
              Start-Sleep -Seconds 300
          }
