name: win 11 ngrok rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install and Start ngrok Tunnel
        shell: powershell
        run: |
          Write-Host "Installing ngrok via Chocolatey..."
          choco install ngrok --no-progress -y
          
          $ngrokPath = "C:\ProgramData\chocolatey\bin\ngrok.exe"
          if (-not (Test-Path $ngrokPath)) {
              $ngrokPath = "ngrok"
          }

          Write-Host "Authenticating ngrok..."
          & $ngrokPath config add-authtoken "3GAmkQyZ4aTDXmW8gL8bAYj5fD3_7U3pzSH4fnHg4ReB2pfiB"
          
          Write-Host "Starting TCP Tunnel..."
          Start-Process $ngrokPath -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          $maxRetries = 12
          $retryCount = 0
          $publicUrl = $null
          while ($retryCount -lt $maxRetries -and -not $publicUrl) {
              Start-Sleep -Seconds 5
              try {
                  $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
                  if ($response.tunnels.Count -gt 0) {
                      $publicUrl = $response.tunnels[0].public_url
                  }
              } catch {
                  Write-Host "API not ready yet, retrying... ($($retryCount + 1)/$maxRetries)"
              }
              $retryCount++
          }

          if (-not $publicUrl) {
              Write-Error "Could not reach ngrok API within 60 seconds. Tunnel may not have started."
              exit 1
          }

          if ($publicUrl -match "tcp://(.+)") {
              $rdpAddress = $Matches[1]
              
              Write-Host "`n==============================================="
              Write-Host "🚀 RDP CONNECTION INFO"
              Write-Host "Address (Computer): $rdpAddress"
              Write-Host "Username: RDP"
              Write-Host "Password: TechZoner@001"
              Write-Host "===============================================`n"
          } else {
              Write-Error "Unexpected tunnel URL format: $publicUrl"
              exit 1
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via ngrok..."
              Start-Sleep -Seconds 300
          }
