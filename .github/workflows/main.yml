name: win 11 playit rdp

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download playit.gg Agent
        shell: powershell
        run: |
          $playitDir = "C:\playit"
          New-Item -ItemType Directory -Path $playitDir -Force | Out-Null
          $playitExe = "$playitDir\playit.exe"

          Write-Host "Downloading playit.gg agent..."
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile $playitExe -UseBasicParsing

          if (-not (Test-Path $playitExe)) {
              Write-Error "Download failed."
              exit 1
          }
          Write-Host "Download complete: $playitExe"

      - name: Start playit.gg Agent and Capture Claim URL
        shell: powershell
        run: |
          $playitDir = "C:\playit"
          $playitExe = "$playitDir\playit.exe"
          $logFile = "$playitDir\playit_output.log"
          $errFile = "$playitDir\playit_err.log"

          if (-not (Test-Path $playitExe)) {
              Write-Error "playit.exe not found. Download step failed."
              exit 1
          }

          if (Test-Path $logFile) { Remove-Item $logFile -Force }
          if (Test-Path $errFile) { Remove-Item $errFile -Force }

          Write-Host "Starting playit agent in foreground (stdout mode)..."
          $proc = Start-Process -FilePath $playitExe -ArgumentList "--stdout" -WorkingDirectory $playitDir -NoNewWindow -RedirectStandardOutput $logFile -RedirectStandardError $errFile -PassThru

          $claimUrl = $null
          for ($i = 0; $i -lt 12; $i++) {
              Start-Sleep -Seconds 5
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw
                  if ($content -match "https://playit\.gg/claim/[A-Za-z0-9]+") {
                      $claimUrl = $Matches[0]
                      break
                  }
              }
              Write-Host "Waiting for claim URL... ($($i+1)/12)"
          }

          if ($claimUrl) {
              Write-Host "`n==============================================="
              Write-Host "PLAYIT.GG CLAIM URL:"
              Write-Host $claimUrl
              Write-Host "===============================================`n"
              Write-Host "Open the URL above, claim the agent, create a TCP tunnel for port 3389,"
              Write-Host "and use the given host:port in Remote Desktop."
          } else {
              Write-Warning "Claim URL not found in log within 60 seconds."
              Write-Host "--- Last 30 lines of playit output ---"
              if (Test-Path $logFile) { Get-Content $logFile -Tail 30 }
              if (Test-Path $errFile) { Get-Content $errFile -Tail 30 }
              Write-Host "The agent may still be starting. Check the log file manually: $logFile"
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active via playit.gg..."
              Start-Sleep -Seconds 300
          }
